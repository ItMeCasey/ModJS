name: release

# Push a tag such as v2026.11.26 to build only the modules whose mod_version equals the tag (unit tests; the self test runs in the build workflow), then publish a GitHub release and upload to CurseForge
# only the builds whose own mod_version equals the tag version. The other builds are skipped (never re-uploaded), and the run
# fails only when no build matches the tag.
# Needs the repository secret CURSEFORGE_TOKEN (a CurseForge upload API token).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_type:
        description: CurseForge release type
        type: choice
        options: [beta, alpha, release]
        default: beta
      publish:
        description: Upload to CurseForge (off builds and attaches the jars to the run only)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - name: Pick the builds for this tag
        id: pick
        # Builds the modules whose own mod_version equals the tag (the newest version on a manual run), plus the Forge 1.20.1
        # jar whenever NeoForge 1.20.1 is released (that one file is uploaded for both). Fails when no build has the version.
        run: python3 .github/scripts/plan_matrix.py release --tag "${GITHUB_REF_NAME}"

  build:
    needs: pick
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.pick.outputs.matrix) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - run: chmod +x gradlew
      # Unit tests run here. The game test server self test runs in the build workflow on the same commit, so it is not repeated.
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: jar-${{ matrix.module }}
          path: ${{ matrix.module }}/build/libs/*.jar
          if-no-files-found: error


  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: jar-*

      - name: Check the version
        id: version
        run: |
          versions=$(grep -h '^mod_version=' */gradle.properties | sed 's/^mod_version=//' | sort -uV)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then version="${GITHUB_REF_NAME#v}"; else version=$(echo "$versions" | tail -n 1); fi
          if ! echo "$versions" | grep -qx "$version"; then
            echo "No build has mod_version $version (found: $(echo $versions))"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          builds=""
          for file in */gradle.properties; do
            module="${file%/gradle.properties}"
            if [ "$(sed -n 's/^mod_version=//p' "$file")" = "$version" ]; then
              echo "uploading $module (mod_version $version)"; builds="$builds $module"
            else
              echo "skipping $module: mod_version $(sed -n 's/^mod_version=//p' "$file") is not $version"
            fi
          done
          echo "builds=$(echo $builds | sed 's/ /, /g')" >> "$GITHUB_OUTPUT"

      - name: Write the release notes
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_SHA}^" 2>/dev/null || true)
          {
            echo "Builds in this release: ${{ steps.version.outputs.builds }}."
            echo
            echo "Guide: https://itmecasey.com/wiki/modjs/"
            echo
            echo "Changes:"
            if [ -n "$previous" ]; then git log --no-merges --pretty='format:- %s' "$previous..${GITHUB_SHA}"; else git log --no-merges -n 20 --pretty='format:- %s'; fi
            echo
          } > notes.md
          cat notes.md

      - name: Collect the jars
        run: python3 .github/scripts/publish_curseforge.py --artifacts artifacts --version "${{ steps.version.outputs.version }}" --collect dist

      - name: GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.jar \
            --title "ModJS ${{ steps.version.outputs.version }}" \
            --notes-file notes.md \
            --prerelease

      - name: Upload to CurseForge
        if: github.ref_type == 'tag' || inputs.publish
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          python3 .github/scripts/publish_curseforge.py \
            --artifacts artifacts \
            --version "${{ steps.version.outputs.version }}" \
            --changelog-file notes.md \
            --release-type "${{ inputs.release_type || 'beta' }}"

      - name: Keep the jars with the run
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: release-jars
          path: dist/*.jar
