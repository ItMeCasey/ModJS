name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: forge-26.1.2
            java: 25
          - module: forge-1.21.1
            java: 21
          - module: forge-1.20.1
            java: 17
          - module: neoforge-1.21.1
            java: 21
          - module: neoforge-26.1.2
            java: 25
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - run: chmod +x gradlew
      - run: ./gradlew build --no-daemon
      - name: Game test server (self test)
        run: |
          mkdir -p run/modjs
          cp -r ../smoke-test/startup_scripts ../smoke-test/server_scripts ../smoke-test/client_scripts run/modjs/
          ./gradlew runGameTestServer --no-daemon 2>&1 | tee selftest.log
          grep -q "SELFTEST DONE failures=0" selftest.log
          ! grep -q "SELFTEST FAIL" selftest.log
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.module }}
          path: ${{ matrix.module }}/build/libs/*.jar
