name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: forge-26.1.2
            java: 25
          - module: forge-1.21.1
            java: 21
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - run: chmod +x gradlew
      - run: ./gradlew build --no-daemon
      - name: Game test server (self test)
        run: ./gradlew runGameTestServer --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module }}
          path: ${{ matrix.module }}/build/libs/*.jar
