name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Only the builds that the pushed files affect are built (see .github/scripts/plan_matrix.py); docs, status and workflow
  # only pushes build nothing.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
      extension: ${{ steps.plan.outputs.extension }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: plan
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python3 .github/scripts/plan_matrix.py build --before "$BEFORE" --sha "${{ github.sha }}"
  build:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew build --no-daemon
      - name: Game test server (self test)
        run: |
          mkdir -p run/modjs
          cp -r ../smoke-test/startup_scripts ../smoke-test/server_scripts ../smoke-test/client_scripts run/modjs/
          # Forge's game test server can keep the process alive after the tests finish; stop it after 8 minutes.
          # Pass or fail is decided by the two grep checks below, not by the exit code.
          timeout 480 ./gradlew runGameTestServer --no-daemon 2>&1 | tee selftest.log || true
          grep -q "SELFTEST DONE failures=0" selftest.log
          ! grep -q "SELFTEST FAIL" selftest.log
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.module }}
          path: ${{ matrix.module }}/build/libs/*.jar

  # The VS Code extension in vscode-modjs/ is built and tested only when files there change. No game module is built for it.
  extension:
    needs: plan
    if: needs.plan.outputs.extension == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-modjs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-modjs/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v5
        with:
          name: vscode-modjs
          path: vscode-modjs/*.vsix
          if-no-files-found: error
