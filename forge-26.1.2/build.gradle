plugins {
    id 'java-library'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
    id 'net.minecraftforge.jarjar' version '0.2.3'
}

base.archivesName = mod_id
version = mod_version
group = mod_group

// Mojang ships Java 25 to end users in 26.1+, so the mod targets Java 25.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

// The script engine, event system and data generators live in ../common and are compiled into this mod.
sourceSets {
    main {
        java.srcDir '../common/src/main/java'
        resources.srcDir '../common/src/main/resources'
        resources.srcDir 'src/generated/resources'
    }
    test {
        java.srcDir '../common/src/test/java'
    }
}

minecraft {
    useDefaultAccessTransformer()

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
        }

        register('client') {
            // `-PquickWorld=<folder>` opens that saved world on launch, for the screenshot tour in docs/frames.
            if (project.hasProperty('quickWorld')) { args '--quickPlaySingleplayer', project.property('quickWorld') }
        }

        register('server') {
            args '--nogui'
        }

        register('gameTestServer') {
            // Enables the in-game event self test; see SelfTest.java and run/modjs/server_scripts/selftest.js.
            systemProperty 'modjs.selftest', 'true'
        }

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')
            args '--mod', mod_id, '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

// Ships Rhino inside the mod jar so players do not need to install it.
jarJar.register {
    archiveClassifier = null
}

tasks.named('jar', Jar) {
    archiveClassifier = 'slim'
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    // The overlay mods the script info API (InfoEvents) talks to. Compile-only: the plugin classes load only when the mod is installed.
    compileOnly files('../libs/smwti-api-26.1.2.jar')
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    implementation "org.mozilla:rhino:${rhino_version}"
    jarJar("org.mozilla:rhino:${rhino_version}")

    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

processResources {
    inputs.property 'mod_id', mod_id
    inputs.property 'mod_version', mod_version
    filesMatching('META-INF/mods.toml') {
        expand 'mod_id': mod_id, 'mod_name': mod_name, 'mod_version': mod_version, 'mod_license': mod_license
    }
}
